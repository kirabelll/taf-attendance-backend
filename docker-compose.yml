services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taf-backend
    restart: always
    ports:
      - "172.16.10.96:8004:8004"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: taf_attendance.settings
      PYTHONUNBUFFERED: "1"
    command: python manage.py runserver 0.0.0.0:8004

  frontend:
    build:
      context: ./taf-attendance
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/
    container_name: taf-frontend
    restart: always
    ports:
      - "8005:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api/
